<!DOCTYPE html>
<html>
<head>
    <title>Restaurant Page</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background: #f5f5f5;
        }

        header {
            background: #333;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .menu {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            padding: 30px;
        }

        .food {
            background: white;
            width: 220px;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 2px 8px #bbb;
        }

        .food h3 {
            margin-bottom: 10px;
        }

        .price {
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>
    <h1>Food Corner</h1>
    <p>Delicious Food for Everyone</p>
</header>

<div class="menu">

    <div class="food">
        <h3>Pizza</h3>
        <p>Cheesy vegetable pizza</p>
        <p class="price">₹199</p>
    </div>

    <div class="food">
        <h3>Burger</h3>
        <p>Fresh vegetable burger</p>
        <p class="price">₹149</p>
    </div>

    <div class="food">
        <h3>Pasta</h3>
        <p>Creamy white sauce pasta</p>
        <p class="price">₹179</p>
    </div>

</div>

<center>
    <a href="index.html">← CSS Programs</a>
    <br><br>
    <a href="../index.html">Home</a>
</center>

</body>
</html>
