<!DOCTYPE html>
<html>
<head>
    <title>CSS 22 - Login Page</title>

    <style>
        .login {
            width: 300px;
            margin: 80px auto;
            padding: 25px;
            border: 1px solid gray;
            border-radius: 10px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background: black;
            color: white;
            border: none;
        }

        button:hover {
            background: gray;
        }
    </style>
</head>

<body>

    <div class="login">

        <h2>Login</h2>

        <input type="email" placeholder="Email">

        <input type="password" placeholder="Password">

        <button>Login</button>

    </div>

    <a href="index.html">← CSS Programs</a>
    <br><br>
    <a href="../index.html">Home</a>

</body>
</html>
