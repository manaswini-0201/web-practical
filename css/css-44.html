<!DOCTYPE html>
<html>
<head>
    <title>CSS 44 - Object Fit</title>

    <style>
        .cover {
            width: 250px;
            height: 150px;
            object-fit: cover;
            object-position: center;
        }

        .contain {
            width: 250px;
            height: 150px;
            object-fit: contain;
            background: lightgray;
        }
    </style>
</head>

<body>

    <h1>Object Fit and Object Position</h1>

    <h2>Object Fit: Cover</h2>

    <img class="cover"
         src="https://picsum.photos/500/300"
         alt="Cover">

    <h2>Object Fit: Contain</h2>

    <img class="contain"
         src="https://picsum.photos/500/300"
         alt="Contain">

</body>
</html>
