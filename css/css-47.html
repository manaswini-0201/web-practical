<!DOCTYPE html>
<html>
<head>
    <title>CSS 47 - Dashboard Grid</title>

    <style>
        .dashboard {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .card {
            padding: 30px;
            text-align: center;
            border: 1px solid gray;
            border-radius: 10px;
        }

        @media (max-width: 700px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <h1>Student Dashboard</h1>

    <div class="dashboard">

        <div class="card">
            <h2>Attendance</h2>
            <p>85%</p>
        </div>

        <div class="card">
            <h2>Assignments</h2>
            <p>8 Completed</p>
        </div>

        <div class="card">
            <h2>Subjects</h2>
            <p>6 Subjects</p>
        </div>

        <div class="card">
            <h2>Projects</h2>
            <p>3 Projects</p>
        </div>

        <div class="card">
            <h2>Marks</h2>
            <p>78%</p>
        </div>

        <div class="card">
            <h2>Events</h2>
            <p>2 Upcoming</p>
        </div>

    </div>

    <br>

    <a href="index.html">← CSS Programs</a>
    <br><br>
    <a href="../index.html">Home</a>

</body>
</html>
