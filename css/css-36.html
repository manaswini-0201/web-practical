<!DOCTYPE html>
<html>
<head>
    <title>CSS 36 - Z-Index</title>

    <style>
        .container {
            position: relative;
            height: 300px;
        }

        .box1 {
            position: absolute;
            top: 50px;
            left: 50px;
            width: 150px;
            height: 150px;
            background: lightblue;
            z-index: 1;
            padding: 20px;
        }

        .box2 {
            position: absolute;
            top: 100px;
            left: 120px;
            width: 150px;
            height: 150px;
            background: lightcoral;
            z-index: 2;
            padding: 20px;
        }
    </style>
</head>

<body>

    <h1>Z-Index Example</h1>

    <div class="container">
        <div class="box1">Box 1</div>
        <div class="box2">Box 2</div>
    </div>

    <p>Box 2 appears above Box 1 because it has a higher z-index.</p>

    <a href="../index.html">Home</a>

</body>
</html>
