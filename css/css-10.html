<!DOCTYPE html>
<html>
<head>
    <title>CSS 10 - Pseudo Classes</title>

    <style>
        a:link {
            color: blue;
        }

        a:visited {
            color: purple;
        }

        a:hover {
            color: red;
        }

        a:active {
            color: green;
        }

        input:focus {
            background: lightyellow;
        }

        button:hover {
            background: lightblue;
        }
    </style>
</head>

<body>

    <h1>CSS Pseudo-Classes</h1>

    <a href="https://www.google.com">Visit Google</a>

    <br><br>

    <input type="text" placeholder="Click here">

    <br><br>

    <button>Hover Over Me</button>

    <br><br>

    <a href="index.html">← CSS Programs</a>
    <br><br>
    <a href="../index.html">Home</a>

</body>
</html>
