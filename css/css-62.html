<!DOCTYPE html>
<html>
<head>
    <title>Flexbox Alignment</title>

    <style>
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            height: 300px;
            background: #eee;
        }

        .box {
            width: 100px;
            height: 100px;
            background: lightblue;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .one {
            order: 3;
        }

        .two {
            order: 1;
        }

        .three {
            order: 2;
        }
    </style>
</head>

<body>

<h1>Flexbox Alignment and Ordering</h1>

<div class="container">

    <div class="box one">One</div>
    <div class="box two">Two</div>
    <div class="box three">Three</div>

</div>

</center>

</body>
</html>
