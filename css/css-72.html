<!DOCTYPE html>
<html>
<head>
    <title>Responsive Typography</title>

    <style>
        body {
            font-family: Arial;
            margin: 20px;
        }

        h1 {
            font-size: 8vw;
        }

        p {
            font-size: 4vw;
        }

        @media (min-width: 700px) {
            h1 {
                font-size: 50px;
            }

            p {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

<h1>Responsive Heading</h1>

<p>
    The text size changes according to the screen size.
</p>

</body>
</html>
