<!DOCTYPE html>
<html>
<head>
    <title>CSS 08 - Float and Clear</title>

    <style>
        .box {
            width: 120px;
            height: 120px;
            background: lightblue;
            float: left;
            margin: 10px;
            padding: 10px;
        }

        .clear {
            clear: both;
            background: lightgreen;
            padding: 15px;
        }
    </style>
</head>

<body>

    <h1>Float and Clear</h1>

    <div class="box">Box 1</div>
    <div class="box">Box 2</div>

    <p>
        Float allows elements to move to the left or right.
        Text can flow around floated elements.
    </p>

    <div class="clear">
        This section uses clear: both.
    </div>

    <br>

    <a href="index.html">← CSS Programs</a>

    <a href="../index.html">Home</a>

</body>
</html>
