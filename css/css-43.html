<!DOCTYPE html>
<html>
<head>
    <title>CSS 43 - Filters</title>

    <style>
        .normal {
            width: 250px;
        }

        .blur {
            width: 250px;
            filter: blur(3px);
        }

        .gray {
            width: 250px;
            filter: grayscale(100%);
        }

        .bright {
            width: 250px;
            filter: brightness(150%);
        }
    </style>
</head>

<body>

    <h1>CSS Filters</h1>

    <h2>Normal</h2>
    <img class="normal"
         src="https://picsum.photos/250/150"
         alt="Normal">

    <h2>Blur</h2>
    <img class="blur"
         src="https://picsum.photos/250/150"
         alt="Blur">

    <h2>Grayscale</h2>
    <img class="gray"
         src="https://picsum.photos/250/150"
         alt="Grayscale">

    <h2>Brightness</h2>
    <img class="bright"
         src="https://picsum.photos/250/150"
         alt="Bright">

    <br>

    <a href="../index.html">Home</a>

</body>
</html>
