<!DOCTYPE html>
<html>
<head>
    <title>CSS 38 - Visibility</title>

    <style>
        .visible {
            background: lightblue;
            padding: 20px;
        }

        .hidden {
            visibility: hidden;
            background: lightgreen;
            padding: 20px;
        }

        .none {
            display: none;
            background: lightcoral;
            padding: 20px;
        }
    </style>
</head>

<body>

    <h1>Visibility and Hiding</h1>

    <div class="visible">
        This element is visible.
    </div>

    <br>

    <div class="hidden">
        This element is hidden using visibility: hidden.
    </div>

    <br>

    <div class="none">
        This element is hidden using display: none.
    </div>

    <p>
        visibility: hidden keeps the space,
        while display: none removes the element from the layout.
    </p>

    <a href="index.html">← CSS Programs</a>
    <br><br>
    <a href="../index.html">Home</a>

</body>
</html>
