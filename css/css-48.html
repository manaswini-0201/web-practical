<!DOCTYPE html>
<html>
<head>
    <title>CSS 48 - Two Column Grid</title>

    <style>
        .container {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
        }

        .left,
        .right {
            padding: 30px;
            border: 1px solid gray;
        }

        .left {
            background: lightblue;
        }

        .right {
            background: lightgreen;
        }

        @media (max-width: 600px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <h1>Two Column Grid</h1>

    <div class="container">

        <div class="left">
            <h2>Sidebar</h2>
            <p>Menu and links.</p>
        </div>

        <div class="right">
            <h2>Main Content</h2>
            <p>
                This section contains the main webpage content.
            </p>
        </div>

    </div>

    <br>

    <a href="index.html">← CSS Programs</a>
    <br><br>
    <a href="../index.html">Home</a>

</body>
</html>
