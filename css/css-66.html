<!DOCTYPE html>
<html>
<head>
    <title>2D and 3D Transforms</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
        }

        .container {
            display: flex;
            justify-content: center;
            gap: 80px;
            margin-top: 80px;
        }

        .box {
            width: 120px;
            height: 120px;
            background: lightblue;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 0.5s;
        }

        .box:hover {
            transform: rotate(20deg) scale(1.2);
        }

        .box3d:hover {
            transform: rotateY(180deg);
        }
    </style>
</head>

<body>

<h1>2D and 3D Transforms</h1>

<div class="container">

    <div class="box">
        2D Transform
    </div>

    <div class="box box3d">
        3D Transform
    </div>

</div>

</body>
</html>
