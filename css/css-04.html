<!DOCTYPE html>
<html>
<head>
    <title>CSS Fonts</title>

    <style>

        body {
            font-family: Arial;
        }

        h1 {
            font-size: 35px;
            text-align: center;
            color: blue;
        }

        .bold {
            font-weight: bold;
        }

        .italic {
            font-style: italic;
        }

        .upper {
            text-transform: uppercase;
        }

        .space {
            letter-spacing: 3px;
        }

    </style>
</head>

<body>

    <h1>Font Properties</h1>

    <p class="bold">
        This text is bold.
    </p>

    <p class="italic">
        This text is italic.
    </p>

    <p class="upper">
        this text becomes uppercase.
    </p>

    <p class="space">
        This text has letter spacing.
    </p>

    <a href="index.html">← CSS Programs</a>
    <br><br>
    <a href="../index.html">Home</a>

</body>
</html>
