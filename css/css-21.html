<!DOCTYPE html>
<html>
<head>
    <title>CSS 21 - Student Profile</title>

    <style>
        .profile {
            width: 300px;
            margin: 50px auto;
            padding: 25px;
            text-align: center;
            border: 1px solid gray;
            border-radius: 15px;
        }

        .profile img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
        }

        .profile h2 {
            margin-bottom: 5px;
        }
    </style>
</head>

<body>

    <h1>Student Profile</h1>

    <div class="profile">

        <img src="https://via.placeholder.com/100" alt="Student">

        <h2>Lakshmi</h2>

        <p>Web Development Student</p>
        <p>College: ABC University</p>
        <p>Course: Computer Science</p>

    </div>

    <a href="index.html">← CSS Programs</a>
    <br><br>
    <a href="../index.html">Home</a>

</body>
</html>
