<!DOCTYPE html>
<html>
<head>
    <title>CSS 34 - Opacity</title>

    <style>
        .normal {
            background: lightblue;
            padding: 30px;
        }

        .semi {
            background: lightblue;
            opacity: 0.5;
            padding: 30px;
        }

        .transparent {
            background: rgba(0, 0, 255, 0.3);
            padding: 30px;
        }
    </style>
</head>

<body>

    <h1>Opacity and Transparency</h1>

    <div class="normal">
        Normal element
    </div>

    <br>

    <div class="semi">
        50% opacity
    </div>

    <br>

    <div class="transparent">
        Transparent background using RGBA
    </div>

    <br>

    <a href="index.html">← CSS Programs</a>

    <a href="../index.html">Home</a>

</body>
</html>
