<!DOCTYPE html>
<html>
<head>
    <title>clamp min max</title>

    <style>
        body {
            font-family: Arial;
            margin: 20px;
        }

        h1 {
            font-size: clamp(25px, 6vw, 60px);
        }

        .box {
            width: min(90%, 600px);
            min-height: 150px;
            padding: 20px;
            margin: 30px auto;
            background: lightblue;
        }

        p {
            font-size: max(16px, 2vw);
        }
    </style>
</head>

<body>

<h1>Responsive CSS Functions</h1>

<div class="box">
    <h2>clamp(), min() and max()</h2>

    <p>
        These functions help create responsive layouts.
    </p>
</div>

</body>
</html>
