<!DOCTYPE html>

    <title>CSS 27 - Selectors</title>

    <style>
        * {
            font-family: Arial;

        h1 {

        }

        .box {
            background: lightgreen;
            padding: 15px;
        }

        #special {
            color: red;

        input[type="text"] {

    <input type="text" placeholder="Attribute selector">
