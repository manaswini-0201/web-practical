<!DOCTYPE html>
<html>
<head>
    <title>CSS 53 - Login and Signup</title>

    <style>
        .container {
            display: flex;
            justify-content: center;
            gap: 30px;
        }

        .form-box {
            width: 280px;
            padding: 25px;
            border: 1px solid gray;
            border-radius: 10px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
        }

        @media (max-width: 700px) {
            .container {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>

<body>

    <h1>Responsive Login and Signup</h1>

    <div class="container">

        <div class="form-box">

            <h2>Login</h2>

            <input type="email" placeholder="Email">
            <input type="password" placeholder="Password">

            <button>Login</button>

        </div>

        <div class="form-box">

            <h2>Signup</h2>

            <input type="text" placeholder="Name">
            <input type="email" placeholder="Email">
            <input type="password" placeholder="Password">

            <button>Signup</button>

        </div>

    </div>

    <br>

    <a href="index.html">← CSS Programs</a>
    <br><br>
    <a href="../index.html">Home</a>

</body>
</html>
