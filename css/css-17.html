<!DOCTYPE html>
<html>
<head>
    <title>CSS 17 - Transitions</title>

    <style>
        .box {
            width: 150px;
            height: 150px;
            background: lightblue;
            margin: 50px;
            transition: 0.5s;
            text-align: center;
            padding: 20px;
        }

        .box:hover {
            transform: scale(1.2) rotate(5deg);
        }
    </style>
</head>

<body>

    <h1>Transitions and Transformations</h1>

    <div class="box">
        Hover over me
    </div>

    <a href="index.html">← CSS Programs</a>
    <br><br>
    <a href="../index.html">Home</a>

</body>
</html>
