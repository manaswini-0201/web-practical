<!DOCTYPE html>
<html>
<head>
    <title>CSS 49 - Three Column Flexbox</title>

    <style>
        .container {
            display: flex;
            gap: 20px;
        }

        .column {
            flex: 1;
            padding: 30px;
            border: 1px solid gray;
            text-align: center;
        }

        @media (max-width: 600px) {
            .container {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <h1>Three Column Flexbox</h1>

    <div class="container">

        <div class="column">
            <h2>Column 1</h2>
            <p>HTML</p>
        </div>

        <div class="column">
            <h2>Column 2</h2>
            <p>CSS</p>
        </div>

        <div class="column">
            <h2>Column 3</h2>
            <p>JavaScript</p>
        </div>

    </div>

    <br>

    <a href="index.html">← CSS Programs</a>
    <br><br>
    <a href="../index.html">Home</a>

</body>
</html>
