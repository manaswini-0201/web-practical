<!DOCTYPE html>
<html>
<head>
    <title>CSS 31 - Gradients</title>

    <style>
        .linear {
            height: 150px;
            background: linear-gradient(to right, blue, purple);
            padding: 20px;
            color: white;
        }

        .radial {
            height: 150px;
            background: radial-gradient(circle, yellow, orange);
            padding: 20px;
        }
    </style>
</head>

<body>

    <h1>CSS Gradients</h1>

    <div class="linear">
        Linear Gradient
    </div>

    <br>

    <div class="radial">
        Radial Gradient
    </div>
