<!DOCTYPE html>
<html>
<head>
    <title>CSS 40 - Image Hover</title>

    <style>
        img {
            width: 300px;
            transition: 0.5s;
        }

        img:hover {
            transform: scale(1.1);
            opacity: 0.7;
        }
    </style>
</head>

<body>

    <h1>Image Hover Effect</h1>

    <img src="https://picsum.photos/300/200" alt="Sample Image">

    <p>Move your mouse over the image.</p>

</body>
</html>
