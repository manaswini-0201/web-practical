<!DOCTYPE html>
<html>
<head>
    <title>CSS 41 - Tooltip</title>

    <style>
        .tooltip {
            position: relative;
            display: inline-block;
            margin: 50px;
        }

        .text {
            visibility: hidden;
            background: black;
            color: white;
            padding: 8px;
            position: absolute;
            bottom: 120%;
            left: 0;
            white-space: nowrap;
        }

        .tooltip:hover .text {
            visibility: visible;
        }
    </style>
</head>

<body>

    <h1>CSS Tooltip</h1>

    <div class="tooltip">
        Hover over me
        <span class="text">This is a tooltip!</span>
    </div>

</body>
</html>
