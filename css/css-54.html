<!DOCTYPE html>
<html>
<head>
    <title>CSS 54 - Contact Form</title>

    <style>
        form {
            max-width: 500px;
            margin: auto;
            padding: 25px;
            border: 1px solid gray;
            border-radius: 10px;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        textarea {
            height: 120px;
        }

        button {
            padding: 10px 20px;
        }

        @media (max-width: 600px) {
            form {
                margin: 10px;
            }
        }
    </style>
</head>

<body>

    <h1>Contact Us</h1>

    <form>

        <label>Name</label>
        <input type="text" placeholder="Enter your name">

        <label>Email</label>
        <input type="email" placeholder="Enter your email">

        <label>Message</label>
        <textarea placeholder="Enter your message"></textarea>

        <button type="submit">Send Message</button>

    </form>

    <br>

    <a href="index.html">← CSS Programs</a>
    <br><br>
    <a href="../index.html">Home</a>

</body>
</html>
