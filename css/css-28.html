<!DOCTYPE html>
<html>
<head>
    <title>CSS 28 - Combinators</title>

    <style>
        .box p {
            color: blue;
        }

        .box > p {
            background: lightyellow;
        }

        h2 + p {
            font-weight: bold;
        }

        h2 ~ p {
            border-left: 3px solid black;
            padding-left: 10px;
        }
    </style>
</head>

<body>

    <h1>Combinator Selectors</h1>

    <div class="box">

        <h2>Heading</h2>

        <p>Paragraph 1</p>

        <div>
            <p>Paragraph inside another div.</p>
        </div>

        <p>Paragraph 3</p>

    </div>

    <br>

    <a href="../index.html">Home</a>

</body>
</html>
