<!DOCTYPE html>
<html>
<head>
    <title>CSS 13 - Registration Form</title>

    <style>
        body {
            font-family: Arial;
        }

        form {
            width: 300px;
            padding: 20px;
            border: 2px solid #333;
            border-radius: 10px;
        }

        input, select {
            width: 100%;
            padding: 8px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            border: none;
            background: black;
            color: white;
        }

        button:hover {
            background: gray;
        }
    </style>
</head>

<body>

    <h1>Student Registration</h1>

    <form>

        <label>Name</label>
        <input type="text" placeholder="Enter your name">

        <label>Email</label>
        <input type="email" placeholder="Enter your email">

        <label>Course</label>

        <select>
            <option>BCA</option>
            <option>B.Sc Computer Science</option>
            <option>B.Tech</option>
        </select>

        <button type="submit">Register</button>

    </form>

    <br>

    <a href="index.html">← CSS Programs</a>
    <br><br>
    <a href="../index.html">Home</a>

</body>
</html>
