<!DOCTYPE html>
<html>
<head>
    <title>CSS Transitions</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
        }

        .box {
            width: 150px;
            height: 150px;
            background: lightblue;
            margin: 80px auto;
            display: flex;
            justify-content: center;
            align-items: center;

            transition: 0.5s;
        }

        .box:hover {
            transform: scale(1.2);
            border-radius: 50%;
        }

        button {
            padding: 12px 25px;
            transition: 0.4s;
        }

        button:hover {
            transform: translateY(-5px);
        }
    </style>
</head>

<body>

<h1>CSS Transitions</h1>

<div class="box">
    Hover Me
</div>

<button>Hover Button</button>

</body>
</html>
