<!DOCTYPE html>
<html>
<head>
    <title>CSS 23 - Product Card</title>

    <style>
        .card {
            width: 250px;
            margin: 50px auto;
            padding: 20px;
            text-align: center;
            border: 1px solid gray;
            border-radius: 15px;
        }

        .card img {
            width: 200px;
            height: 150px;
            object-fit: cover;
        }

        .price {
            font-size: 20px;
            font-weight: bold;
        }

        button {
            padding: 10px 20px;
        }
    </style>
</head>

<body>

    <div class="card">

        <img src="https://via.placeholder.com/200x150" alt="Product">

        <h2>Smart Bottle</h2>

        <p>Smart water bottle for students.</p>

        <p class="price">₹999</p>

        <button>Buy Now</button>

    </div>

    <a href="index.html">← CSS Programs</a>
    <br><br>
    <a href="../index.html">Home</a>

</body>
</html>
