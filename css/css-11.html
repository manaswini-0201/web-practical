<!DOCTYPE html>
<html>
<head>
    <title>CSS 11 - Pseudo Elements</title>

    <style>
        p::first-letter {
            font-size: 40px;
        }

        p::first-line {
            font-weight: bold;
        }

        h2::before {
            content: "★ ";
        }

        h2::after {
            content: " ★";
        }
    </style>
</head>

<body>

    <h1>Pseudo-Elements</h1>

    <h2>Welcome</h2>

    <p>
        This paragraph demonstrates first-letter
        and first-line pseudo-elements.
    </p>

    <br>

    <a href="index.html">← CSS Programs</a>

    <a href="../index.html">Home</a>

</body>
</html>
