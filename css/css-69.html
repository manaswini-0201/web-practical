<!DOCTYPE html>
<html>
<head>
    <title>Sliding Card Animation</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
        }

        .card {
            width: 250px;
            padding: 30px;
            margin: 80px auto;
            background: lightblue;

            animation: slide 2s infinite alternate;
        }

        @keyframes slide {
            from {
                transform: translateX(-100px);
            }

            to {
                transform: translateX(100px);
            }
        }
    </style>
</head>

<body>

<h1>Sliding Card Animation</h1>

<div class="card">
    <h2>Welcome!</h2>
    <p>This card moves from left to right.</p>
</div>

</body>
</html>
