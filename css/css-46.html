<!DOCTYPE html>
<html>
<head>
    <title>CSS 46 - Card Flexbox</title>

    <style>
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }

        .card {
            width: 200px;
            padding: 20px;
            text-align: center;
            border: 1px solid gray;
            border-radius: 10px;
        }

        .card h2 {
            margin-top: 0;
        }
    </style>
</head>

<body>

    <h1>Card Based Flexbox</h1>

    <div class="container">

        <div class="card">
            <h2>HTML</h2>
            <p>Webpage structure.</p>
        </div>

        <div class="card">
            <h2>CSS</h2>
            <p>Webpage styling.</p>
        </div>

        <div class="card">
            <h2>JavaScript</h2>
            <p>Webpage interaction.</p>
        </div>

        <div class="card">
            <h2>Bootstrap</h2>
            <p>Responsive design.</p>
        </div>

    </div>

</body>
</html>
