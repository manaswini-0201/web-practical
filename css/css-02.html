<!DOCTYPE html>
<html>
<head>
    <title>CSS Selectors</title>

    <style>

        * {
            font-family: Arial;
        }

        h1 {
            color: blue;
        }

        .student {
            color: green;
        }

        #special {
            color: red;
        }

        input[type="text"] {
            border: 2px solid blue;
        }

        h2, p {
            margin: 10px;
        }

    </style>
</head>

<body>

    <h1>CSS Selectors</h1>

    <h2 class="student">Class Selector</h2>

    <p id="special">ID Selector</p>

    <p>Element Selector</p>

    <input type="text" placeholder="Attribute selector">

    <br><br>

    <a href="index.html">← CSS Programs</a>
    <br><br>
    <a href="../index.html">Home</a>

</body>
</html>
