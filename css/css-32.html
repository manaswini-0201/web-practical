<!DOCTYPE html>
<html>
<head>
    <title>CSS 32 - Shadows</title>

    <style>
        .box {
            width: 250px;
            padding: 30px;
            margin: 50px auto;
            text-align: center;
            box-shadow: 5px 5px 15px gray;
        }

        h1 {
            text-shadow: 3px 3px 5px gray;
        }
    </style>
</head>

<body>

    <h1>CSS Shadows</h1>

    <div class="box">
        This box has a box shadow.
    </div>
