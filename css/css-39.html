<!DOCTYPE html>
<html>
<head>
    <title>CSS 39 - Dropdown Menu</title>

    <style>
        .dropdown {
            position: relative;
            display: inline-block;
        }

        .button {
            background: black;
            color: white;
            padding: 12px;
            cursor: pointer;
        }

        .menu {
            display: none;
            position: absolute;
            background: white;
            border: 1px solid gray;
            min-width: 150px;
        }

        .menu a {
            display: block;
            padding: 10px;
            text-decoration: none;
            color: black;
        }

        .menu a:hover {
            background: lightgray;
        }

        .dropdown:hover .menu {
            display: block;
        }
    </style>
</head>

<body>

    <h1>CSS Dropdown Menu</h1>

    <div class="dropdown">

        <div class="button">Menu ▼</div>

        <div class="menu">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </div>

    </div>

    <br><br><br>

    <a href="index.html">← CSS Programs</a>
    <br><br>
    <a href="../index.html">Home</a>

</body>
</html>
