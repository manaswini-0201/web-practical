<!DOCTYPE html>
<html>
<head>
    <title>CSS 45 - Responsive Gallery</title>

    <style>
        .gallery {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .gallery img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        @media (max-width: 800px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 500px) {
            .gallery {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <h1>Responsive Image Gallery</h1>

    <div class="gallery">

        <img src="https://picsum.photos/300/200?1" alt="Photo 1">
        <img src="https://picsum.photos/300/200?2" alt="Photo 2">
        <img src="https://picsum.photos/300/200?3" alt="Photo 3">
        <img src="https://picsum.photos/300/200?4" alt="Photo 4">
        <img src="https://picsum.photos/300/200?5" alt="Photo 5">
        <img src="https://picsum.photos/300/200?6" alt="Photo 6">
        <img src="https://picsum.photos/300/200?7" alt="Photo 7">
        <img src="https://picsum.photos/300/200?8" alt="Photo 8">

    </div>

    <br>

</body>
</html>
