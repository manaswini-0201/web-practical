<!DOCTYPE html>
<html>
<head>
    <title>CSS 33 - Border Radius</title>

    <style>
        .rounded {
            width: 200px;
            padding: 30px;
            background: lightblue;
            border-radius: 20px;
        }

        .circle {
            width: 120px;
            height: 120px;
            background: lightgreen;
            border-radius: 50%;
        }

        .pill {
            width: 200px;
            padding: 15px;
            background: lightcoral;
            border-radius: 50px;
        }
    </style>
</head>

<body>

    <h1>Border Radius and Shapes</h1>

    <div class="rounded">Rounded Box</div>

    <br>

    <div class="circle"></div>

    <br>

    <div class="pill">Pill Shape</div>

    <br>

    <a href="index.html">← CSS Programs</a>
    <br><br>
    <a href="../index.html">Home</a>

</body>
</html>
