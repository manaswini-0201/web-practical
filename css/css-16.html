<!DOCTYPE html>
<html>
<head>
    <title>CSS 16 - Media Queries</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: lightblue;
        }

        .box {
            padding: 40px;
            margin: 30px;
            background: white;
        }

        @media (max-width: 600px) {
            body {
                background: lightgreen;
            }

            .box {
                margin: 10px;
                padding: 20px;
            }

            h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <h1>Responsive Webpage</h1>

    <div class="box">
        Resize the browser window to see the change.
    </div>

    <br>

    <a href="index.html">← CSS Programs</a>
    <br><br>
    <a href="../index.html">Home</a>

</body>
</html>
