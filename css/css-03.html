<!DOCTYPE html>
<html>
<head>
    <title>CSS Colors</title>

    <style>

        body {
            background-color: lightgray;
        }

        h1 {
            color: blue;
        }

        .box {
            background-color: white;
            border: 3px solid black;
            padding: 30px;
            margin: 30px;
        }

        .red {
            color: red;
        }

        .green {
            color: green;
        }

    </style>
</head>

<body>

    <h1>Colors, Backgrounds and Borders</h1>

    <div class="box">

        <p class="red">
            This text is red.
        </p>

        <p class="green">
            This text is green.
        </p>

        <p>
            This box has a background and border.
        </p>

    </div>

    <a href="index.html">← CSS Programs</a>
    <br><br>
    <a href="../index.html">Home</a>

</body>
</html>
