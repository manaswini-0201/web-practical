<!DOCTYPE html>
<html>
<head>
    <title>CSS 50 - Sticky Header</title>

    <style>
        header {
            position: sticky;
            top: 0;
            background: black;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .content {
            padding: 30px;
            height: 1000px;
        }
    </style>
</head>

<body>

    <header>
        <h2>My Sticky Header</h2>
    </header>

    <div class="content">

        <h1>Sticky Header Example</h1>

        <p>
            Scroll down the page. The header stays at the top.
        </p>

        <p>
            This is sample content used to demonstrate
            sticky positioning.
        </p>

    </div>

    <a href="index.html">← CSS Programs</a>
    <br><br>
    <a href="../index.html">Home</a>

</body>
</html>
