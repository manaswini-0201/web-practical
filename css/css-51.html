<!DOCTYPE html>
<html>
<head>
    <title>CSS 51 - Fixed Sidebar</title>

    <style>
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 180px;
            height: 100%;
            padding: 20px;
            background: lightblue;
        }

        .sidebar a {
            display: block;
            padding: 10px;
            text-decoration: none;
        }

        .content {
            margin-left: 240px;
            padding: 30px;
            height: 1000px;
        }
    </style>
</head>

<body>

    <div class="sidebar">

        <h2>Menu</h2>

        <a href="#">Home</a>
        <a href="#">Profile</a>
        <a href="#">Projects</a>
        <a href="#">Contact</a>

    </div>

    <div class="content">

        <h1>Fixed Sidebar</h1>

        <p>
            The sidebar remains fixed while the content can scroll.
        </p>

        <p>
            Scroll down to test the sidebar.
        </p>

    </div>

    <a href="index.html">← CSS Programs</a>
    <br><br>
    <a href="../index.html">Home</a>

</body>
</html>
