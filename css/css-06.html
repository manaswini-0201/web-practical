<!DOCTYPE html>
<html>
<head>
    <title>CSS 06 - Width and Height</title>

    <style>
        .box1 {
            width: 200px;
            height: 100px;
            background: lightblue;
        }

        .box2 {
            width: 50%;
            height: 150px;
            background: lightgreen;
        }

        .box3 {
            max-width: 400px;
            min-height: 100px;
            background: lightcoral;
        }
    </style>
</head>

<body>

    <h1>Width, Height and Sizing</h1>

    <div class="box1">200px × 100px</div>
    <br>

    <div class="box2">50% Width</div>
    <br>

    <div class="box3">Min Height and Max Width</div>

    <br>

    <a href="index.html">← CSS Programs</a>
    <br><br>
    <a href="../index.html">Home</a>

</body>
</html>
