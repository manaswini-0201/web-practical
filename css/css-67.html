<!DOCTYPE html>
<html>
<head>
    <title>Keyframe Animation</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
        }

        .ball {
            width: 80px;
            height: 80px;
            background: lightblue;
            border-radius: 50%;
            margin: 100px auto;

            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-100px);
            }

            100% {
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

<h1>CSS Keyframe Animation</h1>

<div class="ball"></div>

<p>The ball moves using @keyframes.</p>

</body>
</html>
