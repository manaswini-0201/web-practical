<!DOCTYPE html>
<html>
<head>
    <title>Online Shopping Page</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background: #f4f4f4;
        }

        header {
            background: #222;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .products {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            padding: 30px;
        }

        .product {
            background: white;
            width: 220px;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
        }

        .product img {
            width: 150px;
            height: 150px;
            object-fit: cover;
        }

        button {
            background: #222;
            color: white;
            border: 0;
            padding: 10px 20px;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<header>
    <h1>My Online Store</h1>
</header>

<div class="products">

    <div class="product">
        <img src="https://via.placeholder.com/150" alt="Bag">
        <h3>College Bag</h3>
        <p>₹799</p>
        <button>Buy Now</button>
    </div>

    <div class="product">
        <img src="https://via.placeholder.com/150" alt="Shoes">
        <h3>Shoes</h3>
        <p>₹999</p>
        <button>Buy Now</button>
    </div>

    <div class="product">
        <img src="https://via.placeholder.com/150" alt="Watch">
        <h3>Watch</h3>
        <p>₹599</p>
        <button>Buy Now</button>
    </div>

</div>

<center>
    <a href="index.html">← CSS Programs</a>
    <br><br>
    <a href="../index.html">Home</a>
</center>

</body>
</html>
