<!DOCTYPE html>
<html>
<head>
    <title>Travel Homepage</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
        }

        .hero {
            background: lightblue;
            text-align: center;
            padding: 100px 20px;
        }

        .hero h1 {
            font-size: 45px;
        }

        .places {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            padding: 30px;
        }

        .place {
            width: 220px;
            padding: 25px;
            background: #f2f2f2;
            text-align: center;
            border-radius: 10px;
        }

        .place:hover {
            transform: translateY(-5px);
        }
    </style>
</head>

<body>

<div class="hero">
    <h1>WanderNest Travels</h1>
    <p>Explore. Travel. Create Memories.</p>
</div>

<div class="places">

    <div class="place">
        <h2>Goa</h2>
        <p>Beautiful beaches and relaxing views.</p>
    </div>

    <div class="place">
        <h2>Ooty</h2>
        <p>Enjoy the hills and cool weather.</p>
    </div>

    <div class="place">
        <h2>Manali</h2>
        <p>Experience mountains and adventure.</p>
    </div>

</div>

<center>
    <a href="index.html">← CSS Programs</a>
    <br><br>
    <a href="../index.html">Home</a>
</center>

</body>
</html>
