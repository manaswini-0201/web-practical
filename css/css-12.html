<!DOCTYPE html>
<html>
<head>
    <title>CSS 12 - Lists and Tables</title>

    <style>
        ul {
            list-style-type: square;
        }

        li {
            margin: 8px;
        }

        table {
            border-collapse: collapse;
            width: 60%;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        th {
            background: lightblue;
        }

        tr:hover {
            background: lightyellow;
        }
    </style>
</head>

<body>

    <h1>Styled Lists</h1>

    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ul>

    <h1>Styled Table</h1>

    <table>
        <tr>
            <th>Name</th>
            <th>Course</th>
        </tr>

        <tr>
            <td>Lakshmi</td>
            <td>Web Development</td>
        </tr>

        <tr>
            <td>Student 2</td>
            <td>Computer Science</td>
        </tr>
    </table>

    <br>

    <a href="index.html">← CSS Programs</a>
    <br><br>
    <a href="../index.html">Home</a>

</body>
</html>
