<!DOCTYPE html>
<html>
<head>
    <title>CSS 14 - Flexbox</title>

    <style>
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            height: 300px;
            border: 2px solid black;
        }

        .box {
            width: 100px;
            height: 100px;
            background: lightblue;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>

<body>

    <h1>Flexbox Example</h1>

    <div class="container">

        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>

    </div>

    <a href="../index.html">Home</a>

</body>
</html>
