<!DOCTYPE html>
<html>
<head>
    <title>CSS 42 - Button Hover</title>

    <style>
        button {
            padding: 15px 30px;
            border: 2px solid black;
            background: white;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: black;
            color: white;
            transform: translateY(-3px);
        }
    </style>
</head>

<body>

    <h1>CSS-Only Button Hover</h1>

    <button>Hover Over Me</button>

</html>
