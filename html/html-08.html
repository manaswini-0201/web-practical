<!DOCTYPE html>
<html>
<head>
    <title>Semantic HTML</title>

    <style>
        header, nav, section, article, footer {
            padding: 20px;
            margin: 10px;
            border: 1px solid #333;
        }

        header {
            background: #ddd;
        }

        nav {
            background: #eee;
        }

        footer {
            background: #ddd;
        }
    </style>
</head>

<body>

    <header>
        <h1>My College Website</h1>
    </header>

    <nav>
        <a href="#">Home</a> |
        <a href="#">About</a> |
        <a href="#">Contact</a>
    </nav>

    <section>

        <h2>Web Technology</h2>

        <article>
            <h3>About HTML</h3>

            <p>
                HTML is used to create the structure of webpages.
            </p>
        </article>

    </section>

    <footer>
        <p>© 2026 My College</p>
    </footer>

    <br>

    <a href="index.html">← Back to HTML Programs</a>
    <br><br>
    <a href="../index.html">Home</a>

</body>
</html>
