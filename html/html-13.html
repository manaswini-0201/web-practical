            font-family: Arial;
            margin: 0;
        }

        header {
            background: #222;
            color: white;
            text-align: center;
            padding: 30px;
        }

        .container {
            display: flex;
            gap: 20px;
            padding: 30px;
        }

        .box {
            flex: 1;
            background: lightblue;
            padding: 30px;

        }

        @media (max-width: 600px) {
            .container {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

        <h1>Responsive Webpage</h1>
    </header>

    <div class="container">

        <div class="box">
            <h2>HTML</h2>
            <p>Structure of webpages.</p>
        </div>

        <div class="box">
            <h2>CSS</h2>
            <p>Styling of webpages.</p>
        </div>

            <p>Webpage functionality.</p>
        </div>
