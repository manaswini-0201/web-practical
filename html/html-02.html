        <li>JavaScript</li>
    </ol>

    <h2>Unordered List</h2>

    <ul>

        <li>Edge</li>

    <dl>

        <dd>Used to create webpage structure.</dd>

        <dt>CSS</dt>
        <dd>Used to style webpages.</dd>

        <dt>JavaScript</dt>
        <dd>Used to add functionality.</dd>
    </dl>
