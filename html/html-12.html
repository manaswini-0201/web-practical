<!DOCTYPE html>
<html>
<head>
    <title>CSS Styling</title>

    <style>
        body {
            font-family: Arial;
        }

        h1 {
            color: blue;
        }

        .box {
            background: lightyellow;
            margin: 20px;
            padding: 20px;
            border: 2px solid black;
        }

        #special {
            color: red;
            font-size: 20px;
        }
    </style>
</head>

<body>

    <h1>CSS Selectors and Styling</h1>

    <div class="box">

        <p id="special">
            This paragraph demonstrates an ID selector.
        </p>

        <p>
            This box demonstrates margin, padding and border.
        </p>

    </div>

    <a href="index.html">← HTML Programs</a>
    <br><br>
    <a href="../index.html">Home</a>

</body>
</html>
