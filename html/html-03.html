<!DOCTYPE html>
<html>
<head>
    <title>HTML Tables</title>

    <style>
        table {
            border-collapse: collapse;
            width: 70%;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        th {
            background: #ddd;
        }
    </style>
</head>

<body>

    <h1>Student Marks Table</h1>

    <table>

        <tr>
            <th colspan="3">Student Details</th>
        </tr>

        <tr>
            <th>Name</th>
            <th>Subject</th>
            <th>Marks</th>
        </tr>

        <tr>
            <td>Lakshmi</td>
            <td>Web Technology</td>
            <td>90</td>
        </tr>

        <tr>
            <td>Rahul</td>
            <td>Web Technology</td>
            <td>85</td>
        </tr>

    </table>

    <br>

    <a href="index.html">← Back to HTML Programs</a>
    <br><br>
    <a href="../index.html">Home</a>

</body>
</html>
