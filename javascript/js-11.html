<!DOCTYPE html>
<html>
<head>
    <title>Sum of Digits</title>
</head>

<body>

<h1>Sum of Digits</h1>

<script>

    let number = 12345;
    let sum = 0;

    while (number > 0) {

        let digit = number % 10;
        sum = sum + digit;

        number = Math.floor(number / 10);
    }

    document.write("Sum of digits = " + sum);

</script>
