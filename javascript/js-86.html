<!DOCTYPE html>
<html>
<head>
    <title>Double Click Event</title>
</head>
<body>

<h2 id="text">Double-Click Event</h2>

<button ondblclick="changeText()">Double Click Me</button>

<script>
function changeText() {
    document.getElementById("text").innerHTML =
        "You Double-Clicked the Button!";
}
</script>
