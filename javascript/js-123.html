<!DOCTYPE html>
<html>
<head>
    <title>Multiple localStorage Values</title>
</head>
<body>

<h2>Store Multiple Values</h2>

<button onclick="saveData()">Save Data</button>
<button onclick="showData()">Show Data</button>

<p id="result"></p>

<script>
function saveData() {

    localStorage.setItem("name", "Lakshmi");
    localStorage.setItem("course", "Web Development");
    localStorage.setItem("college", "College");

    document.getElementById("result").innerHTML =
        "Data saved!";
}

function showData() {

    document.getElementById("result").innerHTML =
        "Name: " + localStorage.getItem("name") +
        "<br>Course: " + localStorage.getItem("course") +
        "<br>College: " + localStorage.getItem("college");
}
</script>

</body>
</html>
