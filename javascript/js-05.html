<!DOCTYPE html>
<html>
<head>
    <title>Positive Negative Zero</title>
</head>

<body>

<h1>Check Number</h1>

<script>

    let number = -10;

    if (number > 0) {
        document.write("The number is Positive");
    }
    else if (number < 0) {
        document.write("The number is Negative");
    }
    else {
        document.write("The number is Zero");
    }

</script>
