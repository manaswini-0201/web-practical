<!DOCTYPE html>
<html>
<head>
    <title>Merge Arrays</title>
</head>
<body>

<h2>Merge Two Arrays</h2>
<p id="output"></p>

<script>
let a = [1, 2, 3];
let b = [4, 5, 6];

let result = [...a, ...b];

document.getElementById("output").innerHTML =
    "Merged Array: " + result;
</script>

</body>
</html>
