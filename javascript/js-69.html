<!DOCTYPE html>
<html>
<head>
    <title>Remove Element</title>
</head>
<body>

<h2>Remove Element</h2>

<p id="text">This paragraph will be removed.</p>

<button onclick="removeElement()">Remove</button>

<script>
function removeElement() {
    document.getElementById("text").remove();
}
</script>

</body>
</html>
