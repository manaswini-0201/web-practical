<!DOCTYPE html>
<html>
<head>
    <title>Stopwatch</title>

    <style>
        #time {
            font-size: 40px;
            margin: 30px;
        }
    </style>
</head>
<body>

<h1>Stopwatch</h1>

<div id="time">0</div>

<button onclick="start()">Start</button>
<button onclick="stop()">Stop</button>
<button onclick="reset()">Reset</button>

<script>
let seconds = 0;
let timer;

function start() {

    timer = setInterval(function() {

        seconds++;

        document.getElementById("time").innerHTML =
            seconds + " seconds";

    }, 1000);
}

function stop() {
    clearInterval(timer);
}

function reset() {

    clearInterval(timer);

    seconds = 0;

    document.getElementById("time").innerHTML =
        "0";
}
</script>

</body>
</html>
