<!DOCTYPE html>
<html>
<head>
    <title>Spread and Rest</title>
</head>
<body>

<h2>Spread and Rest Operators</h2>
<p id="output"></p>

<script>
let a = [10, 20, 30];
let b = [...a, 40, 50];

function sum(...numbers) {
    return numbers.reduce((total, n) => total + n, 0);
}

document.getElementById("output").innerHTML =
    "Spread Array: " + b + "<br>" +
    "Rest Sum: " + sum(10, 20, 30);
</script>

</body>
</html>
