<!DOCTYPE html>
<html>
<head>
    <title>Array Frequency</title>
</head>
<body>

<h2>Frequency of Elements</h2>
<p id="output"></p>

<script>
let arr = [1, 2, 2, 3, 1, 2, 4];
let frequency = {};

for (let item of arr) {
    frequency[item] = (frequency[item] || 0) + 1;
}

document.getElementById("output").innerHTML =
    JSON.stringify(frequency);
</script>

</body>
</html>
