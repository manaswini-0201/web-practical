<!DOCTYPE html>
<html>
<head>
    <title>Array in localStorage</title>
</head>
<body>

<h2>Store Array Using JSON</h2>

<button onclick="save()">Save Array</button>
<button onclick="show()">Show Array</button>

<p id="result"></p>

<script>
function save() {

    let subjects = ["HTML", "CSS", "JavaScript"];

    localStorage.setItem(
        "subjects",
        JSON.stringify(subjects)
    );

    document.getElementById("result").innerHTML =
        "Array saved!";
}

function show() {

    let subjects = JSON.parse(
        localStorage.getItem("subjects")
    );

    document.getElementById("result").innerHTML =
        subjects.join(", ");
}
</script>

</html>
