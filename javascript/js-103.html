<!DOCTYPE html>
<html>
<head>
    <title>Countdown Timer</title>
</head>
<body>

<h2>Countdown Timer</h2>

<h1 id="timer">10</h1>

<script>
let count = 10;

let timer = setInterval(function() {

    document.getElementById("timer").innerHTML = count;

    count--;

    if (count < 0) {
        clearInterval(timer);
        document.getElementById("timer").innerHTML =
            "Time's Up!";
    }

}, 1000);
</script>
