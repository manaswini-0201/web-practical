<!DOCTYPE html>
<html>
<head>
    <title>Change Text</title>
</head>
<body>

<h1>Change Text using JavaScript</h1>

<p id="message">Old Text</p>

<button onclick="changeText()">Change Text</button>

<script>
function changeText() {
    document.getElementById("message").innerHTML = "Text Changed Successfully!";
}
</script>
