<!DOCTYPE html>
<html>
<head>
    <title>Dynamic Validation</title>
</head>
<body>

<h2>Dynamic Validation Messages</h2>

<label>Name:</label>
<input type="text" id="name" oninput="checkName()">

<p id="nameError"></p>

<label>Email:</label>
<input type="email" id="email" oninput="checkEmail()">

<p id="emailError"></p>

<script>
function checkName() {

    let name = document.getElementById("name").value;

    if (name == "") {
        document.getElementById("nameError").innerHTML =
            "Name is required.";
    }
    else {
        document.getElementById("nameError").innerHTML =
            "Name is valid.";
    }
}

function checkEmail() {

    let email = document.getElementById("email").value;

    if (email.includes("@")) {
        document.getElementById("emailError").innerHTML =
            "Email is valid.";
    }
    else {
        document.getElementById("emailError").innerHTML =
            "Enter a valid email.";
    }
}
</script>

</html>
