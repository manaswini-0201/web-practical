<head>
    <title>Largest of Three Numbers</title>
</head>

<body>

<h1>Largest of Three Numbers</h1>

<script>

    let a = 25;
    let b = 40;
    let c = 15;

    let largest;

    if (a >= b && a >= c) {
        largest = a;
    }
    else if (b >= a && b >= c) {
        largest = b;
    }
    else {
        largest = c;
    }

    document.write("Numbers: " + a + ", " + b + ", " + c + "<br>");
    document.write("Largest number: " + largest);

</script>
