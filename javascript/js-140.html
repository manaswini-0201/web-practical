<!DOCTYPE html>
<html>
<head>
    <title>Persistent Shopping Cart</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 30px;
        }

        button, input {
            padding: 10px;
            margin: 5px;
        }
    </style>
</head>
<body>

<h2>Shopping Cart</h2>

<input type="text" id="product" placeholder="Enter product">
<button onclick="addProduct()">Add</button>

<h3>Cart</h3>

<ul id="cart"></ul>

<script>
let cart = JSON.parse(localStorage.getItem("shoppingCart")) || [];

function addProduct() {
    let product = document.getElementById("product").value;

    if (product != "") {
        cart.push(product);

        localStorage.setItem(
            "shoppingCart",
            JSON.stringify(cart)
        );

        document.getElementById("product").value = "";

        displayCart();
    }
}

function displayCart() {
    let list = document.getElementById("cart");

    list.innerHTML = "";

    cart.forEach(function(item) {
        let li = document.createElement("li");
        li.innerText = item;
        list.appendChild(li);
    });
}

displayCart();
</script>

</body>
</html>
