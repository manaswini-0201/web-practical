<!DOCTYPE html>
<html>
<head>
    <title>Largest and Smallest Array</title>
</head>

<body>

<h1>Largest and Smallest in Array</h1>

<script>

    let numbers = [25, 10, 45, 5, 30];

    let largest = Math.max(...numbers);
    let smallest = Math.min(...numbers);

    document.write("Array: " + numbers + "<br>");
    document.write("Largest: " + largest + "<br>");
    document.write("Smallest: " + smallest);

</script>
