<!DOCTYPE html>
<html>
<head>
    <title>Fetch API</title>
</head>
<body>

<h2>Fetch API Example</h2>
<button onclick="getData()">Get Data</button>
<p id="output"></p>

<script>
function getData() {
    fetch("https://jsonplaceholder.typicode.com/users/1")
        .then(response => response.json())
        .then(data => {
            document.getElementById("output").innerHTML =
                "Name: " + data.name + "<br>" +
                "Email: " + data.email;
        });
}
</script>

</body>
</html>
