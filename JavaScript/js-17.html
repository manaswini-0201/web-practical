<!DOCTYPE html>
<html>
<head>
    <title>String Methods</title>
</head>

<body>

<h1>String Methods</h1>

<script>

    let text = "Hello JavaScript";

    document.write("Original: " + text + "<br>");
    document.write("Length: " + text.length + "<br>");
    document.write("Uppercase: " + text.toUpperCase() + "<br>");
    document.write("Lowercase: " + text.toLowerCase() + "<br>");
    document.write("First Character: " + text.charAt(0) + "<br>");
    document.write("Includes JavaScript: " + text.includes("JavaScript"));

</script>
