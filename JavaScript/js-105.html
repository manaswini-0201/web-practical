<!DOCTYPE html>
<html>
<head>
    <title>Location Object</title>
</head>
<body>

<h2>Location Object</h2>

<button onclick="showLocation()">Show URL</button>

<p id="result"></p>

<script>
function showLocation() {

    document.getElementById("result").innerHTML =
        "Current URL: " + window.location.href;
}
</script>
