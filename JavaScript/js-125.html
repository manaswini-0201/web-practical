<!DOCTYPE html>
<html>
<head>
    <title>Object in localStorage</title>
</head>
<body>

<h2>Store JavaScript Object</h2>

<button onclick="save()">Save Object</button>
<button onclick="show()">Show Object</button>

<p id="result"></p>

<script>
function save() {

    let student = {
        name: "Lakshmi",
        course: "B.Tech",
        year: 1
    };

    localStorage.setItem(
        "student",
        JSON.stringify(student)
    );

    document.getElementById("result").innerHTML =
        "Student object saved!";
}

function show() {

    let student = JSON.parse(
        localStorage.getItem("student")
    );

    document.getElementById("result").innerHTML =
        "Name: " + student.name +
        "<br>Course: " + student.course +
        "<br>Year: " + student.year;
}
</script>

</body>
</html>
