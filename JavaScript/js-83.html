<!DOCTYPE html>
<html>
<head>
    <title>Mouse Events</title>
</head>
<body>

<h2 id="text">Mouse Events</h2>

<button onclick="clickEvent()">Click Me</button>

<div onmouseover="mouseOver()" onmouseout="mouseOut()"
     style="margin-top:20px;padding:30px;background:lightblue;width:200px;">
    Move Mouse Here
</div>

<script>
function clickEvent() {
    document.getElementById("text").innerHTML = "Button Clicked!";
}

function mouseOver() {
    document.getElementById("text").innerHTML = "Mouse Over";
}

function mouseOut() {
    document.getElementById("text").innerHTML = "Mouse Out";
}
</script>

</body>
</html>
