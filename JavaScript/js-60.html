<!DOCTYPE html>
<html>
<head>
    <title>Common Elements</title>
</head>
<body>

<h2>Common Elements</h2>
<p id="output"></p>

<script>
let a = [1, 2, 3, 4, 5];
let b = [3, 4, 5, 6, 7];

let common = a.filter(function(value) {
    return b.includes(value);
});

document.getElementById("output").innerHTML =
    "Common Elements: " + common;
</script>

</body>
</html>
