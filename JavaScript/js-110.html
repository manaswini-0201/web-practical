<!DOCTYPE html>
<html>
<head>
    <title>Navigator Object</title>
</head>
<body>

<h2>Navigator Object</h2>

<button onclick="showNavigator()">Show Information</button>

<p id="result"></p>

<script>
function showNavigator() {

    document.getElementById("result").innerHTML =
        "Browser: " + navigator.appName +
        "<br>Language: " + navigator.language +
        "<br>Online: " + navigator.onLine;
}
</script>
