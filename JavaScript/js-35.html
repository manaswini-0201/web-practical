<!DOCTYPE html>
<html>
<head>
    <title>Countdown Timer</title>
</head>
<body>

<h1>Countdown Timer</h1>

<h2 id="timer">10</h2>

<button onclick="startTimer()">Start</button>

<script>
let count = 10;

function startTimer() {

    let timer = setInterval(function() {

        document.getElementById("timer").innerHTML =
            count;

        count--;

        if (count < 0) {

            clearInterval(timer);

            document.getElementById("timer").innerHTML =
                "Time's Up!";
        }

    }, 1000);
}
</script>
