<!DOCTYPE html>
<html>
<head>
    <title>setTimeout</title>
</head>
<body>

<h2>setTimeout()</h2>

<button onclick="start()">Start</button>

<p id="result"></p>

<script>
function start() {

    document.getElementById("result").innerHTML =
        "Wait for 3 seconds...";

    setTimeout(function() {
        document.getElementById("result").innerHTML =
            "3 seconds completed!";
    }, 3000);
}
</script>
