<!DOCTYPE html>
<html>
<head>
    <title>Clear localStorage</title>
</head>
<body>

<h2>Clear localStorage</h2>

<button onclick="clearData()">Clear All Data</button>

<p id="result"></p>

<script>
function clearData() {

    localStorage.clear();

    document.getElementById("result").innerHTML =
        "All localStorage data cleared!";
}
</script>
