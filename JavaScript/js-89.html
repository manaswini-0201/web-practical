<!DOCTYPE html>
<html>
<head>
    <title>Keyboard Controlled Game</title>

    <style>
        #box {
            width: 50px;
            height: 50px;
            background: blue;
            position: relative;
        }
    </style>
</head>

<body>

<h2>Keyboard Controlled Box</h2>
<p>Use Arrow Keys to move the box.</p>

<div id="box"></div>

<script>
let box = document.getElementById("box");

let x = 0;
let y = 0;

document.onkeydown = function(event) {

    if (event.key === "ArrowRight") {
        x += 10;
    }

    if (event.key === "ArrowLeft") {
        x -= 10;
    }

    if (event.key === "ArrowDown") {
        y += 10;
    }

    if (event.key === "ArrowUp") {
        y -= 10;
    }

    box.style.left = x + "px";
    box.style.top = y + "px";
};
</script>

</body>
</html>
