<!DOCTYPE html>
<html>
<head>
    <title>Sort an Array</title>
</head>

<body>

<h1>Sort an Array</h1>

<script>

    let numbers = [50, 10, 40, 20, 30];

    document.write("Original Array: " + numbers + "<br>");

    numbers.sort(function(a, b) {
        return a - b;
    });

    document.write("Sorted Array: " + numbers);

</script>
