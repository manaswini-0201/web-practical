<!DOCTYPE html>
<html>
<head>
    <title>Delete localStorage</title>
</head>
<body>

<h2>Delete Username</h2>

<button onclick="deleteData()">Delete</button>

<p id="result"></p>

<script>
function deleteData() {

    localStorage.removeItem("username");

    document.getElementById("result").innerHTML =
        "Username deleted!";
}
</script>
