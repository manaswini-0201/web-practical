<body>

<h1>Date and Math Objects</h1>

<script>

    let today = new Date();

    document.write("Today's Date: " + today.toDateString() + "<br>");

    document.write("Random Number: " + Math.random() + "<br>");

    document.write("Square Root of 25: " + Math.sqrt(25) + "<br>");

    document.write("Power: " + Math.pow(2, 3) + "<br>");

    document.write("Rounded Number: " + Math.round(4.7));

</script>
